# Example Docker Compose file for Redis + RedisInsight.
# Copy this to `docker/redis.yaml` and fill in real values.
# The real `redis.yaml` is git-ignored.
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ../redis/config:/usr/local/etc/redis
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540" # RedisInsight Web UI port
    depends_on:
      - redis
